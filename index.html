                    </div>

                </div>

                        "② 단위 도시·군계획시설부지 면적의 10퍼센트 미만의 변경인 경우",
                        "③ 건축물의 건축에 따른 변속차로의 설치를 위한 도시·군계획시설의 변경인 경우",
                        "④ 도시지역외의 지역에서 「산지관리법」에 의한 보전산지를 자연환경보전지역으로 결정하는 경우",
                        "⑤ 「자연공원법」에 따른 공원구역을 보전관리지역으로 결정하는 경우"
                    ],
                    answer: 3
                }
            ]
        };

        const subjects = Object.keys(quizData);

        // ==========================================
        // 2. Application State Variables
        // ==========================================
        let currentSubject = "";
        let isIncorrectMode = false;
        let questionList = [];
        let currentQuestionIndex = 0;
        let userAnswers = {}; // Mapping of question id to selected option number (1-5)
        let gradedStatus = {}; // ADDED: 문제별 채점 여부 추적

        // ==========================================
        // 3. UI Initialization & Navigation
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            renderHomeCards();
        });

        function getProgress(subject, isIncorrect) {
            const progressData = JSON.parse(localStorage.getItem('cpa_progress') || '{}');
            const key = `${subject}_${isIncorrect}`;
            return progressData[key];
        }

        function renderHomeCards() {
            const container = document.getElementById('subject-cards');
            container.innerHTML = '';
            
            subjects.forEach(subject => {
                const totalQuestions = quizData[subject].length;
                const incorrectCount = (getIncorrectNote()[subject] || []).length;
                
                const normalProgress = getProgress(subject, false);
                const incorrectProgress = getProgress(subject, true);

                let normalText = `총 ${totalQuestions}문제 탑재`;
                if (normalProgress) {
                    const gradedCount = Object.keys(normalProgress.gradedStatus || {}).length;
                    normalText += ` <span class="text-blue-600 font-bold ml-1">(진행률: ${gradedCount}/${normalProgress.questionList.length})</span>`;
                }

                let incorrectText = `오답노트 풀기 <span class="ml-2 bg-red-200 text-red-800 text-xs px-2 py-0.5 rounded-full">${incorrectCount}</span>`;
                if (incorrectProgress && incorrectCount > 0) {
                    const gradedCount = Object.keys(incorrectProgress.gradedStatus || {}).length;
                    incorrectText += ` <span class="text-red-600 font-bold text-xs ml-1">(${gradedCount}/${incorrectProgress.questionList.length})</span>`;
                }
                
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-xl border border-gray-200 shadow-sm hover:shadow-md transition-shadow flex flex-col justify-between";
                card.innerHTML = `
                    <div class="mb-4">
                        <h3 class="text-xl font-bold text-gray-800">${subject}</h3>
                        <p class="text-sm text-gray-500 mt-1">${normalText}</p>
                    </div>
                    <div class="flex flex-col space-y-2">
                        <button onclick="startQuiz('${subject}', false)" class="w-full bg-blue-50 text-blue-700 font-medium py-2 rounded-lg hover:bg-blue-100 transition">
                            전체 기출 풀기
                        </button>
                        <button onclick="startQuiz('${subject}', true)" class="w-full bg-red-50 text-red-700 font-medium py-2 rounded-lg hover:bg-red-100 transition flex justify-center items-center">
                            ${incorrectText}
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function goHome() {
            hideAllScreens();
            document.getElementById('screen-home').classList.remove('hidden');
            document.getElementById('quiz-footer').classList.add('hidden');
            renderHomeCards();
        }

        function hideAllScreens() {
            document.getElementById('screen-home').classList.add('hidden');
            document.getElementById('screen-quiz').classList.add('hidden');
            document.getElementById('screen-result').classList.add('hidden');
        }

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // ==========================================
        // 4. Quiz Execution Logic
        // ==========================================
        function startQuiz(subject, incorrectMode) {
            const savedProgress = getProgress(subject, incorrectMode);
            
            if (savedProgress) {
                showConfirm(
                    `[${subject}] 이전에 풀던 내역이 있습니다.\n이어서 푸시겠습니까?`,
                    () => {
                        // 이어서 풀기
                        currentSubject = subject;
                        isIncorrectMode = incorrectMode;
                        questionList = savedProgress.questionList;
                        currentQuestionIndex = savedProgress.currentQuestionIndex;
                        userAnswers = savedProgress.userAnswers;
                        gradedStatus = savedProgress.gradedStatus;
                        setupQuizUI(subject, incorrectMode);
                    },
                    () => {
                        // 새로 풀기
                        initNewQuiz(subject, incorrectMode);
                    }
                );
            } else {
                initNewQuiz(subject, incorrectMode);
            }
        }

        function initNewQuiz(subject, incorrectMode) {
            currentSubject = subject;
            isIncorrectMode = incorrectMode;
            userAnswers = {};
            gradedStatus = {};
            currentQuestionIndex = 0;

            if (isIncorrectMode) {
                const incorrectIds = getIncorrectNote()[subject] || [];
                // 기존 기출문제 목록에서 오답ID에 해당하는 문제 필터링
                const filtered = quizData[subject].filter(q => incorrectIds.includes(q.id));
                if (filtered.length === 0) {
                    showModal(`[${subject}] 저장된 오답노트가 없습니다.\n먼저 기출문제를 풀어보세요!`);
                    return;
                }
                questionList = shuffleArray(filtered); // 랜덤 출제
            } else {
                questionList = shuffleArray(quizData[subject]); // 랜덤 출제
            }
            
            saveProgress();
            setupQuizUI(subject, incorrectMode);
        }

        function setupQuizUI(subject, incorrectMode) {
            // Set UI
            hideAllScreens();
            document.getElementById('screen-quiz').classList.remove('hidden');
            document.getElementById('quiz-footer').classList.remove('hidden');
            
            document.getElementById('quiz-subtitle').innerText = `${subject} - ${incorrectMode ? '오답노트' : '전체풀이'}`;
            
            renderQuestion();
        }

        function renderQuestion() {
            const q = questionList[currentQuestionIndex];
            
            // Progress update
            document.getElementById('quiz-progress').innerText = `${currentQuestionIndex + 1} / ${questionList.length}`;
            
            // Text update: 연도 병기
            document.getElementById('question-text').innerText = `[${q.year}년] ${q.question}`;
            
            // Options update
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            const isGraded = gradedStatus[q.id]; // 현재 문제 채점 여부
            
            q.options.forEach((optText, index) => {
                const optNum = index + 1;
                const isSelected = userAnswers[q.id] === optNum;
                const isCorrectAns = q.answer === optNum;
                
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-lg border transition-all text-base `;
                
                if (isGraded) {
                    btn.disabled = true; // 채점 후 클릭 방지
                    if (isCorrectAns) {
                        btn.className += 'bg-green-50 border-green-500 text-green-900 ring-2 ring-green-200 font-bold';
                    } else if (isSelected && !isCorrectAns) {
                        btn.className += 'bg-red-50 border-red-500 text-red-900 line-through';
                    } else {
                        btn.className += 'bg-gray-50 border-gray-200 text-gray-400';
                    }
                } else {
                    btn.className += isSelected ? 'bg-blue-50 border-blue-500 text-blue-900 ring-2 ring-blue-200' : 'bg-white border-gray-300 text-gray-700 hover:bg-gray-50';
                    btn.onclick = () => selectOption(q.id, optNum);
                }
                
                btn.innerText = optText;
                optionsContainer.appendChild(btn);
            });

            // Feedback Area (피드백 및 수동 스크랩 버튼)
            const feedbackContainer = document.getElementById('feedback-container');
            if (isGraded) {
                feedbackContainer.classList.remove('hidden');
                feedbackContainer.classList.add('flex', 'flex-col', 'sm:flex-row', 'gap-4'); // 명시적 디스플레이 속성 부여
                
                const isCorrect = userAnswers[q.id] === q.answer;
                
                // 현재 스크랩 상태 확인
                const note = getIncorrectNote();
                const isScrapped = note[currentSubject] && note[currentSubject].includes(q.id);
                
                feedbackContainer.innerHTML = `
                    <div class="flex-1 flex items-center">
                        <span class="text-lg font-bold ${isCorrect ? 'text-green-600' : 'text-red-600'}">
                            ${isCorrect ? '정답입니다!' : '오답입니다.'}
                        </span>
                    </div>
                    <button onclick="toggleScrap('${q.id}')" class="flex-shrink-0 flex items-center justify-center px-4 py-2 rounded-lg font-bold border transition-colors ${isScrapped ? 'bg-yellow-100 border-yellow-400 text-yellow-800' : 'bg-white border-gray-300 text-gray-600 hover:bg-gray-100'}">
                        ${isScrapped ? '★ 오답노트 저장됨' : '☆ 오답노트에 스크랩'}
                    </button>
                `;
            } else {
                feedbackContainer.classList.add('hidden');
                feedbackContainer.classList.remove('flex', 'flex-col', 'sm:flex-row', 'gap-4');
                feedbackContainer.innerHTML = '';
            }

            // Update footer buttons
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            
            btnPrev.style.visibility = currentQuestionIndex === 0 ? 'hidden' : 'visible';
            
            if (!isGraded) {
                btnNext.innerText = "정답 확인";
                btnNext.className = "px-5 py-2.5 rounded-lg font-medium text-white bg-indigo-600 hover:bg-indigo-700 transition";
                btnNext.onclick = checkAnswer;
            } else {
                if (currentQuestionIndex === questionList.length - 1) {
                    btnNext.innerText = "결과 보기";
                    btnNext.className = "px-5 py-2.5 rounded-lg font-medium text-white bg-green-600 hover:bg-green-700 transition";
                    btnNext.onclick = submitQuiz;
                } else {
                    btnNext.innerText = "다음 문제";
                    btnNext.className = "px-5 py-2.5 rounded-lg font-medium text-white bg-blue-600 hover:bg-blue-700 transition";
                    btnNext.onclick = nextQuestion;
                }
            }
        }

        function selectOption(questionId, optionNumber) {
            if (gradedStatus[questionId]) return; // 이미 채점된 경우 변경 불가
            userAnswers[questionId] = optionNumber;
            saveProgress();
            renderQuestion(); // Re-render to show selected state
        }

        // ADDED: 개별 문제 정답 확인
        function checkAnswer() {
            const currentQ = questionList[currentQuestionIndex];
            if (!userAnswers[currentQ.id]) {
                showModal("정답을 선택해주세요.");
                return;
            }
            gradedStatus[currentQ.id] = true;
            saveProgress();
            renderQuestion();
        }

        // ADDED: 수동 스크랩 토글 기능
        function toggleScrap(questionId) {
            let note = getIncorrectNote();
            if (!note[currentSubject]) note[currentSubject] = [];
            
            const index = note[currentSubject].indexOf(questionId);
            if (index > -1) {
                note[currentSubject].splice(index, 1); // 스크랩 해제
            } else {
                note[currentSubject].push(questionId); // 스크랩 추가
            }
            saveIncorrectNote(note);
            renderQuestion(); // UI 업데이트
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                saveProgress();
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < questionList.length - 1) {
                currentQuestionIndex++;
                saveProgress();
                renderQuestion();
            }
        }

        // ==========================================
        // 5. Grading and Local Storage (Incorrect Note)
        // ==========================================
        function submitQuiz() {
            let score = 0;
            let newlyIncorrect = [];

            questionList.forEach(q => {
                if (userAnswers[q.id] === q.answer) {
                    score++;
                } else {
                    newlyIncorrect.push(q);
                }
            });

            // 수동 스크랩 기능 도입으로, 제출 시 자동 저장/삭제 로직은 제거됨
            clearProgress(currentSubject, isIncorrectMode);
            renderResult(score, newlyIncorrect);
        }

        function renderResult(score, incorrectQuestions) {
            hideAllScreens();
            document.getElementById('quiz-footer').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');

            document.getElementById('res-total').innerText = questionList.length;
            document.getElementById('res-correct').innerText = score;

            const listContainer = document.getElementById('incorrect-list');
            listContainer.innerHTML = '';

            if (incorrectQuestions.length === 0) {
                listContainer.innerHTML = `<div class="p-6 bg-green-50 text-green-800 rounded-xl text-center font-semibold">축하합니다! 모든 문제를 맞히셨습니다.</div>`;
                return;
            }

            incorrectQuestions.forEach(q => {
                const userAns = userAnswers[q.id];
                const realAns = q.answer;
                
                const item = document.createElement('div');
                item.className = "bg-white p-5 rounded-xl shadow-sm border border-red-100";
                
                let optionsHtml = q.options.map((optText, idx) => {
                    const optNum = idx + 1;
                    let style = "text-gray-600";
                    let badge = "";
                    if (optNum === realAns) {
                        style = "text-blue-700 font-bold bg-blue-50 p-2 rounded";
                        badge = " <span class='text-xs text-white bg-blue-500 px-2 py-0.5 rounded ml-2'>정답</span>";
                    } else if (optNum === userAns) {
                        style = "text-red-600 font-bold line-through bg-red-50 p-2 rounded";
                        badge = " <span class='text-xs text-white bg-red-500 px-2 py-0.5 rounded ml-2'>선택함</span>";
                    }
                    return `<div class="mb-1 ${style}">${optText}${badge}</div>`;
                }).join('');

                item.innerHTML = `
                    <p class="font-bold text-gray-800 mb-3 whitespace-pre-wrap">${q.question}</p>
                    <div class="text-sm space-y-1 bg-gray-50 p-3 rounded-lg border">
                        ${optionsHtml}
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        // ==========================================
        // 6. Helpers (Modal & LocalStorage)
        // ==========================================
        function saveProgress() {
            const progressData = JSON.parse(localStorage.getItem('cpa_progress') || '{}');
            const key = `${currentSubject}_${isIncorrectMode}`;
            progressData[key] = {
                questionList: questionList,
                currentQuestionIndex: currentQuestionIndex,
                userAnswers: userAnswers,
                gradedStatus: gradedStatus
            };
            localStorage.setItem('cpa_progress', JSON.stringify(progressData));
        }

        function clearProgress(subject, isIncorrect) {
            const progressData = JSON.parse(localStorage.getItem('cpa_progress') || '{}');
            const key = `${subject}_${isIncorrect}`;
            delete progressData[key];
            localStorage.setItem('cpa_progress', JSON.stringify(progressData));
        }

        function getIncorrectNote() {
            const data = localStorage.getItem('cpa_incorrect_note');
            return data ? JSON.parse(data) : {};
        }

        function saveIncorrectNote(data) {
            localStorage.setItem('cpa_incorrect_note', JSON.stringify(data));
        }

        function showModal(msg) {
            document.getElementById('modal-message').innerText = msg;
            
            const btnConfirm = document.getElementById('modal-btn-confirm');
            const btnCancel = document.getElementById('modal-btn-cancel');
            
            btnCancel.classList.add('hidden');
            btnConfirm.innerText = "확인";
            btnConfirm.onclick = closeModal;
            
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function showConfirm(msg, onConfirm, onCancel) {
            document.getElementById('modal-message').innerText = msg;
            
            const btnConfirm = document.getElementById('modal-btn-confirm');
            const btnCancel = document.getElementById('modal-btn-cancel');
            
            btnCancel.classList.remove('hidden');
            btnConfirm.innerText = "예 (이어서 풀기)";
            btnCancel.innerText = "아니오 (새로 풀기)";
            
            btnConfirm.onclick = () => {
                closeModal();
                if(onConfirm) onConfirm();
            };
            
            btnCancel.onclick = () => {
                closeModal();
                if(onCancel) onCancel();
            };
            
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

    </script>
</body>
</html>
